pluginGroup = io.github.godogx.godog
pluginName = goland-plugin
pluginVersion = 0.1.0

# Building against a real, already-installed GoLand (no separate SDK
# download, and it's the exact IDE you actually use) is a per-machine
# preference, not a project default - see local.properties.example.
#
# Without that override, this platformVersion is what gets downloaded and
# built against: check https://www.jetbrains.com/updates/updates.xml
# (product="GoLand"), or run `./gradlew printProductsReleases`.
platformType = GO
platformVersion = 2026.2

kotlin.stdlib.default.dependency = false
